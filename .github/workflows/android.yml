name: Android build

# Builds the Pulse Android APKs (split per ABI) on a GitHub-hosted Linux runner
# and uploads them as a downloadable artifact (no local Android SDK / RAM needed).
#
# On-demand only: to conserve the private repo's shared Actions-minute budget,
# this runs when a build is wanted — the Actions tab's "Run workflow" button, or
# a pushed version tag (v*) — not on every push.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      # Publish the APKs to a public Release so they download without a login.
      - name: Publish Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pulse ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/*.apk
