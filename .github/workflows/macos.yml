name: macOS build

# NOTE: GitHub-hosted macOS runners do not work for this account/repo:
#   - macos-13 (Intel) sits in "Queued" forever — no free Intel capacity is
#     ever allocated (CI runs #31/#33/#34/#35 all stuck);
#   - macos-14 resolves to "macos-14-arm64-us-default", which errors
#     "not supported" and is cancelled in ~2s (CI run #36).
# (macos-14 did build months ago in runs #20-#26, before GitHub changed its
# free Apple-Silicon allocation.) So the Mac app is built on Codemagic instead
# — see codemagic.yaml, free mac_mini_m2. This workflow is kept for manual
# retries only (no tag trigger, so release tags don't spawn dead macOS runs);
# re-add the tag trigger if GitHub ever restores a usable runner here.
on:
  workflow_dispatch:

jobs:
  build-macos:
    # macos-13 (Intel) is the only label this account might ever schedule —
    # macos-14 is arm64 and errors "not supported" here. Even macos-13 currently
    # just queues, so this is effectively a placeholder; Codemagic is the real
    # path (codemagic.yaml). Left at macos-13 so a future free-Intel restore
    # would Just Work on a manual dispatch.
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      # Force CocoaPods over Swift Package Manager so the committed macos/Podfile
      # (pod-signing fix) is used instead of SPM, which collides with it.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # Firebase is only used on Android/iOS/web (push is guarded off on desktop
      # — PushService._supported is false on macOS, where in-app Reverb covers
      # alerts, and there is no macOS Firebase config). Drop the `macos:` platform
      # from the cached firebase plugin pubspecs and re-resolve, so flutter
      # excludes the native Firebase pods from the macOS build. The Dart imports
      # still resolve; only the native plugin is skipped. Mirrors the Windows
      # build's exclusion step.
      - name: Exclude Firebase from the macOS build
        run: |
          ROOT="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          for d in "$ROOT"/firebase_*/; do
            pp="$d/pubspec.yaml"
            [ -f "$pp" ] || continue
            awk '
              { if ($0 ~ /^      macos:[ \t]*$/) { skip=1; next }
                if (skip==1) { if ($0 ~ /^        [^ ]/) { next } else { skip=0 } }
                print }
            ' "$pp" > "$pp.tmp" && mv "$pp.tmp" "$pp"
            echo "patched $pp"
          done
          flutter pub get

      - run: flutter build macos --release

      # Zip the .app bundle (-y keeps the internal symlinks a .app needs).
      - name: Package the app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y pulse_app-macos.zip pulse_app.app

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-app
          path: build/macos/Build/Products/Release/pulse_app-macos.zip

      # Publish to a public Release so the .app can be downloaded without a login.
      - name: Publish Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pulse ${{ github.ref_name }}
          files: build/macos/Build/Products/Release/pulse_app-macos.zip
          fail_on_unmatched_files: true
