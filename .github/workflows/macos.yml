name: macOS build

# Builds the Pulse macOS .app on a GitHub-hosted Mac runner and publishes it as
# a public Release asset (downloadable without login, since the repo is public).
#
# On-demand only: trigger with "Run workflow" on the Actions tab, or by pushing a
# version tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # This account can't schedule the arm64 macos-14 image even on a public repo
    # ("macos-14-arm64-us-default is not supported" -> instant cancel), so use
    # the Intel macos-13. Note GitHub's free Intel macOS capacity can queue a
    # long time; Codemagic (codemagic.yaml) is the reliable free alternative.
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      # Force CocoaPods over Swift Package Manager so the committed macos/Podfile
      # (pod-signing fix) is used instead of SPM, which collides with it.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      # Zip the .app bundle (-y keeps the internal symlinks a .app needs).
      - name: Package the app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y pulse_app-macos.zip pulse_app.app

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-app
          path: build/macos/Build/Products/Release/pulse_app-macos.zip

      # Publish to a public Release so the .app can be downloaded without a login.
      - name: Publish Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pulse ${{ github.ref_name }}
          files: build/macos/Build/Products/Release/pulse_app-macos.zip
          fail_on_unmatched_files: true
