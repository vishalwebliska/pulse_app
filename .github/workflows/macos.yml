name: macOS build

# Builds the Pulse macOS .app on a GitHub-hosted Mac runner and uploads it as a
# downloadable artifact (no local Mac needed).
#
# On-demand only: macOS runners bill at 10x Actions minutes, so running this on
# every push quickly exhausts a private repo's monthly budget. Trigger it when
# you actually want a build — click "Run workflow" on the Actions tab, or push a
# version tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # Intel runner: this account can't schedule the arm64 macos-14 image
    # ("configuration macos-14-arm64-us-default is not supported" -> instant
    # cancel). macos-13 (x86_64) is the broadly-available free macOS runner; the
    # resulting app runs on Apple Silicon Macs via Rosetta.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      # Zip the .app bundle (-y keeps the internal symlinks a .app needs).
      - name: Package the app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y pulse_app-macos.zip pulse_app.app

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-app
          path: build/macos/Build/Products/Release/pulse_app-macos.zip
