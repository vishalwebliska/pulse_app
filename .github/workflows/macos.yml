name: macOS build

# Builds the Pulse macOS .app on a GitHub-hosted Mac runner and publishes it as
# a public Release asset (downloadable without login, since the repo is public).
#
# On-demand only: trigger with "Run workflow" on the Actions tab, or by pushing a
# version tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # Apple-Silicon macOS runner. This label built the app successfully many
    # times (CI runs #20-#26); the later switch to Intel `macos-13` was a
    # misdiagnosis of a few superseded/cancelled runs — macos-13's free Intel
    # capacity queues indefinitely for this repo, while macos-14 picks up a
    # runner in seconds. Codemagic (codemagic.yaml) stays as a backup Mac path.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      # Force CocoaPods over Swift Package Manager so the committed macos/Podfile
      # (pod-signing fix) is used instead of SPM, which collides with it.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # Firebase is only used on Android/iOS/web (push is guarded off on desktop
      # — PushService._supported is false on macOS, where in-app Reverb covers
      # alerts, and there is no macOS Firebase config). Drop the `macos:` platform
      # from the cached firebase plugin pubspecs and re-resolve, so flutter
      # excludes the native Firebase pods from the macOS build. The Dart imports
      # still resolve; only the native plugin is skipped. Mirrors the Windows
      # build's exclusion step.
      - name: Exclude Firebase from the macOS build
        run: |
          ROOT="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          for d in "$ROOT"/firebase_*/; do
            pp="$d/pubspec.yaml"
            [ -f "$pp" ] || continue
            awk '
              { if ($0 ~ /^      macos:[ \t]*$/) { skip=1; next }
                if (skip==1) { if ($0 ~ /^        [^ ]/) { next } else { skip=0 } }
                print }
            ' "$pp" > "$pp.tmp" && mv "$pp.tmp" "$pp"
            echo "patched $pp"
          done
          flutter pub get

      - run: flutter build macos --release

      # Zip the .app bundle (-y keeps the internal symlinks a .app needs).
      - name: Package the app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y pulse_app-macos.zip pulse_app.app

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-app
          path: build/macos/Build/Products/Release/pulse_app-macos.zip

      # Publish to a public Release so the .app can be downloaded without a login.
      - name: Publish Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pulse ${{ github.ref_name }}
          files: build/macos/Build/Products/Release/pulse_app-macos.zip
          fail_on_unmatched_files: true
