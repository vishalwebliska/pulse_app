name: macOS build

# Builds the Pulse macOS .app on a GitHub-hosted Mac runner and publishes it as
# a public Release asset (downloadable without login, since the repo is public).
#
# On-demand only: trigger with "Run workflow" on the Actions tab, or by pushing a
# version tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # Public repos get free macOS runners, including arm64 (macos-14). The
    # earlier "macos-14-arm64 not supported" happened while the repo was private.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      # Zip the .app bundle (-y keeps the internal symlinks a .app needs).
      - name: Package the app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y pulse_app-macos.zip pulse_app.app

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-app
          path: build/macos/Build/Products/Release/pulse_app-macos.zip

      # Publish to a public Release so the .app can be downloaded without a login.
      - name: Publish Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pulse ${{ github.ref_name }}
          files: build/macos/Build/Products/Release/pulse_app-macos.zip
          fail_on_unmatched_files: true
